[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poh-delivery-agent"
version = "0.1.0"
description = "Delivery-Agent: релиз-менеджер контура производства (Temporal-модуль)"
requires-python = ">=3.11"
# Зависимости намеренно минимальные: модуль ставится ВНУТРЬ образа воркера
# Harness, где уже живут temporalio и requests нужных версий. Пины здесь
# перетёрли бы их — поэтому только нижние границы.
dependencies = [
    "requests>=2.31",
    "temporalio>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["poh_delivery*"]
